# Prometheus config for DA3408 A4.
# Prometheus runs in Docker with network_mode: host, so "localhost" below is YOUR machine.
global:
  scrape_interval: 5s        # matches the 5s dashboard refresh required for the video
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  # 1. Application metrics (prometheus_client in app.py, separate port from Streamlit)
  - job_name: captioner_app
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          service: image-captioning

  # 2. System metrics (apt package: prometheus-node-exporter, port 9100)
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          service: host

  # 3. Prometheus monitoring itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
